name: Apply final contract fixes

on:
  push:
    branches:
      - chatgpt/reference-ui-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0

      - name: Decode and apply verified patch
        shell: bash
        run: |
          tr -d '[:space:]' < .chatgpt/final-contract-delta.patch.gz.b64 | base64 --decode > /tmp/final-contract-delta.patch.gz
          echo "680583cba167aa8f94f7d0c0462cd33a9372f99c76fa28317ca6ebdc83dc3f7d  /tmp/final-contract-delta.patch.gz" | sha256sum --check
          gzip -dc /tmp/final-contract-delta.patch.gz > /tmp/final-contract-delta.patch
          echo "871bebecf278ee8e93a8388ca27621486b2418416a3d5ad8f497aef2cdbbe2e6  /tmp/final-contract-delta.patch" | sha256sum --check
          git apply --check /tmp/final-contract-delta.patch
          git apply /tmp/final-contract-delta.patch
          rm -rf .chatgpt
          rm -f .github/workflows/apply-final-contract-delta.yml

      - name: Commit fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai): preserve general isolation and final contracts"
          git push origin HEAD:chatgpt/reference-ui-final
