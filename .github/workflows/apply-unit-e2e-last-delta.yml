name: Apply last validation delta

on:
  push:
    branches:
      - chatgpt/reference-ui-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0

      - name: Decode and apply verified patch
        shell: bash
        run: |
          tr -d '[:space:]' < .chatgpt/unit-e2e-last-delta.patch.gz.b64 | base64 --decode > /tmp/unit-e2e-last-delta.patch.gz
          echo "764d6707dd57662ec82d13bbd766ac96465ba19636a08cd62b9c123b3d5addfd  /tmp/unit-e2e-last-delta.patch.gz" | sha256sum --check
          gzip -dc /tmp/unit-e2e-last-delta.patch.gz > /tmp/unit-e2e-last-delta.patch
          echo "e09c4712f171d20eb8043036aec5cf181f303d3f18fcd01ef1a9d7dced2c176a  /tmp/unit-e2e-last-delta.patch" | sha256sum --check
          git apply --check /tmp/unit-e2e-last-delta.patch
          git apply /tmp/unit-e2e-last-delta.patch
          rm -rf .chatgpt
          rm -f .github/workflows/apply-unit-e2e-last-delta.yml

      - name: Commit delta
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(test): finish unit and real-source contracts"
          git push origin HEAD:chatgpt/reference-ui-final
