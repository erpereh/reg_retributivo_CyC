name: Apply verified final patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize
      - reopened
  push:
    branches:
      - chatgpt/reference-ui-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0
      - name: Diagnose and apply verified patch
        id: patch
        shell: bash
        run: |
          set +e
          mkdir -p artifacts/patch-diagnostics
          {
            echo '=== staged base64 ==='
            wc -c .chatgpt/final-upload.b64
            sha256sum .chatgpt/final-upload.b64
            echo '=== decode ==='
            base64 --decode .chatgpt/final-upload.b64 > /tmp/final-upload.patch.gz
            decode_status=$?
            echo "decode_status=$decode_status"
            wc -c /tmp/final-upload.patch.gz
            sha256sum /tmp/final-upload.patch.gz
            echo '=== gzip ==='
            gzip -t /tmp/final-upload.patch.gz
            gzip_status=$?
            echo "gzip_status=$gzip_status"
            if [ "$gzip_status" = '0' ]; then
              gzip -dc /tmp/final-upload.patch.gz > /tmp/final-upload.patch
              wc -c /tmp/final-upload.patch
              sha256sum /tmp/final-upload.patch
              echo '=== git apply ==='
              git apply --3way --index /tmp/final-upload.patch
              apply_status=$?
              echo "apply_status=$apply_status"
            else
              apply_status=99
            fi
          } 2>&1 | tee artifacts/patch-diagnostics/diagnostics.log
          echo "apply_status=$apply_status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: patch-diagnostics
          path: artifacts/patch-diagnostics
          if-no-files-found: error
          retention-days: 1
      - name: Commit applied patch
        if: steps.patch.outputs.apply_status == '0'
        shell: bash
        run: |
          rm -rf .chatgpt
          rm -f .github/workflows/apply-verified-final-patch.yml
          rm -f .github/workflows/apply-final-fixes.yml
          rm -f .github/workflows/export-source.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ui): complete verified assistant and real source flow'
          git push origin HEAD:chatgpt/reference-ui-final
      - name: Fail if patch did not apply
        if: steps.patch.outputs.apply_status != '0'
        run: exit 1
