name: Apply final verified fixes

on:
  push:
    branches:
      - chatgpt/reference-ui-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0
      - name: Decode and verify patch
        run: |
          base64 --decode .chatgpt/final-fixes.b64 > /tmp/final-fixes.patch.gz
          echo 'b68bde1692fc79f2c37ce69e827e47edc5e1be1a2501a1aeae0eea9e50e64869  /tmp/final-fixes.patch.gz' | sha256sum --check
          gzip -dc /tmp/final-fixes.patch.gz > /tmp/final-fixes.patch
          echo '9aca7bd414e7f390d48f57adba42e5dd6519aa499a42b43874e93610360fecd3  /tmp/final-fixes.patch' | sha256sum --check
          git apply --check /tmp/final-fixes.patch
      - name: Apply and commit
        run: |
          git apply /tmp/final-fixes.patch
          rm -rf .chatgpt
          rm -f .github/workflows/apply-final-fixes.yml
          rm -f .github/workflows/export-dependencies.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ui): align assistant contracts and real fixture flow'
          git push origin HEAD:chatgpt/reference-ui-final
