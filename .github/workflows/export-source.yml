name: Export source archive

on:
  push:
    branches:
      - chatgpt/reference-ui-final
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0
      - name: Package source
        run: |
          git archive --format=zip --output=source.zip HEAD
      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: source-archive
          path: source.zip
          retention-days: 1
