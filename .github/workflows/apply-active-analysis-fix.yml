name: Apply active analysis safety fix

on:
  push:
    branches:
      - chatgpt/reference-ui-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0

      - name: Apply verified patch
        shell: bash
        run: |
          git apply --check .chatgpt/fix-active-analysis.patch
          git apply .chatgpt/fix-active-analysis.patch
          rm -f .chatgpt/fix-active-analysis.patch
          rmdir .chatgpt 2>/dev/null || true
          rm -f .github/workflows/apply-active-analysis-fix.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(ai): guard incomplete active analysis context"
          git push origin HEAD:chatgpt/reference-ui-final
