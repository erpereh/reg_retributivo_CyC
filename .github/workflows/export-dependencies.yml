name: Export installed dependencies

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Package dependencies
        run: tar -I 'zstd -10 -T0' -cf dependencies.tar.zst node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: installed-dependencies
          path: dependencies.tar.zst
          compression-level: 0
          retention-days: 1
