name: UI redesign validation

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit and integration tests
        shell: bash
        run: |
          mkdir -p artifacts/test-report
          set +e
          pnpm exec vitest run --reporter=verbose --reporter=json --outputFile=artifacts/test-report/vitest.json 2>&1 | tee artifacts/test-report/vitest.log
          code=${PIPESTATUS[0]}
          echo "TEST_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-redesign-test-report
          path: artifacts/test-report
          if-no-files-found: error
          retention-days: 14

      - name: Production build
        shell: bash
        run: |
          set +e
          pnpm build 2>&1 | tee artifacts/test-report/build.log
          code=${PIPESTATUS[0]}
          echo "BUILD_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Exercise real files and capture every view
        shell: bash
        run: |
          set +e
          pnpm exec playwright test tests/e2e/ui-redesign-screenshots.spec.ts tests/e2e/real-fixtures-app.spec.ts 2>&1 | tee artifacts/test-report/playwright.log
          code=${PIPESTATUS[0]}
          echo "PLAYWRIGHT_EXIT_CODE=$code" >> "$GITHUB_ENV"
          exit 0

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-real-fixtures-screenshots
          path: |
            artifacts/ui-screenshots
            artifacts/real-fixtures-screenshots
          if-no-files-found: warn
          retention-days: 14

      - name: Validation gate
        shell: bash
        run: |
          test "${TEST_EXIT_CODE:-1}" = "0"
          test "${BUILD_EXIT_CODE:-1}" = "0"
          test "${PLAYWRIGHT_EXIT_CODE:-1}" = "0"
