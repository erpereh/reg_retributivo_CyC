name: Apply production scope fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply focused scope fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/assistant/AssistantProvider.tsx')
          s = p.read_text()
          old = '      const allowedPersonIds = authoritative.type === "analysis" ? (fullAnalysis ? knownPeople.map((person) => person.employeeNumber) : authoritative.associatedPersonIds) : undefined;\n'
          new = '      const allowedPersonIds = authoritative.type === "analysis" ? (fullAnalysis ? knownPeople.map((person) => person.employeeNumber) : [...new Set([...authoritative.associatedPersonIds, ...(authoritative.primaryPersonId ? [authoritative.primaryPersonId] : [])])]) : undefined;\n'
          if old not in s:
              raise SystemExit('scope target not found')
          p.write_text(s.replace(old, new, 1))
          PY
          rm -f .github/workflows/apply-production-scope-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(ai): preserve primary person in authorized scope'
          git push origin HEAD:main
