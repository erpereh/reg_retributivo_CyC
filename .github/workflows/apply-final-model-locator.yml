name: Apply final model locator fix

on:
  push:
    branches:
      - chatgpt/reference-ui-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0

      - name: Decode and apply verified patch
        shell: bash
        run: |
          tr -d '[:space:]' < .chatgpt/final-model-locator.patch.gz.b64 | base64 --decode > /tmp/final-model-locator.patch.gz
          echo "fa9296b4f91be8f12bfaaebf75e94fec46fb2cdaa59628a2d7bb72527fd50b40  /tmp/final-model-locator.patch.gz" | sha256sum --check
          gzip -dc /tmp/final-model-locator.patch.gz > /tmp/final-model-locator.patch
          echo "ee8de4da66a1cc79ddef0873646b3feead7e0478ad2b86912f5c11f6226a3fd2  /tmp/final-model-locator.patch" | sha256sum --check
          git apply --check /tmp/final-model-locator.patch
          git apply /tmp/final-model-locator.patch
          rm -rf .chatgpt
          rm -f .github/workflows/apply-final-model-locator.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(test): select provider model by visible label"
          git push origin HEAD:chatgpt/reference-ui-final
