name: Diagnose ChatGPT UI subparts

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

concurrency:
  group: chatgpt-ui-bundle-transfer
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0

      - name: Persist subpart hash report
        shell: bash
        run: |
          sha256sum .chatgpt/part-02-[0-3].txt > .chatgpt/subpart-hashes.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .chatgpt/subpart-hashes.txt
          git commit -m "chore: record staged subpart hashes"
          git push origin HEAD:chatgpt/reference-ui-final
