name: Apply ChatGPT UI bundle

on:
  push:
    branches:
      - chatgpt/reference-ui-final

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0

      - name: Decode and verify staged bundle
        shell: bash
        run: |
          tr -d '[:space:]' < .chatgpt/changes.tar.gz.b64 | base64 --decode > /tmp/changes.tar.gz
          echo "13aaf372174a1ee8de5b70b0d87eedc65ceae8b241f53f6a384676a648cfe624  /tmp/changes.tar.gz" | sha256sum --check

      - name: Apply files and remove staging helpers
        shell: bash
        run: |
          tar -xzf /tmp/changes.tar.gz
          rm -rf .chatgpt
          rm -f .github/workflows/apply-chatgpt-ui-bundle.yml

      - name: Commit applied changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(ui): clone reference assistant and shell"
          git push origin HEAD:chatgpt/reference-ui-final
