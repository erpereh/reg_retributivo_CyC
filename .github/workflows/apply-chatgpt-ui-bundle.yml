name: Diagnose ChatGPT UI bundle

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

concurrency:
  group: chatgpt-ui-bundle-transfer
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0

      - name: Build hash report
        shell: bash
        run: |
          sha256sum .chatgpt/part-02-[0-3].txt > /tmp/subpart-hashes.txt
          set +e
          cat \
            .chatgpt/part-00.txt \
            .chatgpt/part-01.txt \
            .chatgpt/part-02-0.txt \
            .chatgpt/part-02-1.txt \
            .chatgpt/part-02-2.txt \
            .chatgpt/part-02-3.txt \
            .chatgpt/part-03.txt \
            .chatgpt/part-04.txt \
            .chatgpt/part-05.txt \
            .chatgpt/part-06.txt \
            .chatgpt/part-07.txt \
            .chatgpt/part-08.txt \
            | tr -d '[:space:]' \
            | base64 --decode > /tmp/changes.tar.gz
          decode_status=$?
          set -e
          printf 'decode_status=%s\n' "$decode_status" >> /tmp/subpart-hashes.txt
          sha256sum /tmp/changes.tar.gz >> /tmp/subpart-hashes.txt

      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-ui-bundle-diagnostics
          path: |
            /tmp/subpart-hashes.txt
            /tmp/changes.tar.gz
          if-no-files-found: error
          retention-days: 1
