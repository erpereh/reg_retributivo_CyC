name: Apply final validation patch

on:
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/reference-ui-final
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          tr -d '[:space:]' < .chatgpt/final-part-00.txt | base64 --decode > /tmp/final.patch.gz
          echo "e532bac2e4601d92e9c681b43a829b9ec4fd8904ed2b7b4a6905e1a28489e3a3  /tmp/final.patch.gz" | sha256sum --check
          gzip -dc /tmp/final.patch.gz > /tmp/final.patch
          echo "7a6dc3131bed74b7188712b0ccd79644f4b7e2a6dcfa13634a8f966fcb410393  /tmp/final.patch" | sha256sum --check

      - name: Apply and commit patch
        shell: bash
        run: |
          git apply --3way --index /tmp/final.patch
          rm -rf .chatgpt
          rm -f .github/workflows/apply-final-validation-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ui): validate real sources and assistant evidence"
          git push origin HEAD:chatgpt/reference-ui-final
